<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Задачи БА">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Задачи БА</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --bg:#ffffff; --sheet:#ffffff; --card:#f4f4f5; --line:#ececee; --line2:#e4e4e7;
    --text:#0b0b0c; --text2:#3a3a3e; --muted:#6b6b70; --faint:#8a8a90;
    --ink:#0b0b0c; --ink-t:#ffffff; --hero:#0b0b0c; --hero-t:#ffffff; --hero-2:#d4d4d8; --hero-chip:#2a2a2e;
    --warn-bg:#fff4ec; --warn-chip:#ffebdd; --warn-t:#9a3412; --warn-dot:#ff6a1a;
    --backdrop:#d9d9de;
    --display:Unbounded, Inter, system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#000000; --sheet:#141416; --card:#1c1c1f; --line:#2a2a2e; --line2:#34343a;
      --text:#f5f5f7; --text2:#d4d4d8; --muted:#a1a1aa; --faint:#71717a;
      --ink:#f5f5f7; --ink-t:#0b0b0c; --hero:#f5f5f7; --hero-t:#0b0b0c; --hero-2:#3a3a3e; --hero-chip:#e4e4e7;
      --warn-bg:rgba(255,122,26,.12); --warn-chip:rgba(255,122,26,.2); --warn-t:#ffb27a; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--text);
    font:16px/1.4 Inter, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  button, input, textarea { font:inherit; color:inherit; }
  button { cursor:pointer; }
  svg { flex:0 0 auto; }
  a { color:var(--text); }

  /* ---------- шапка ---------- */
  .top { max-width:720px; margin:0 auto; padding:20px 16px 0; display:flex; flex-direction:column; gap:16px; }
  .bar { display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .brand { font-family:var(--display); font-size:12px; font-weight:700; letter-spacing:.12em; }
  #sync { display:flex; align-items:center; gap:6px; font-size:12px; font-weight:500; color:var(--muted); white-space:nowrap; }
  #sync.bad { color:var(--warn-t); }
  .hello { display:flex; flex-direction:column; gap:4px; }
  #today { font-size:14px; color:var(--muted); }
  #who { margin:0; font-family:var(--display); font-size:32px; line-height:1.08; font-weight:800; letter-spacing:-.01em; min-height:35px; }
  #sub { margin:0; font-size:15px; color:var(--muted); }
  .seg { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:4px; padding:4px; background:var(--card); border-radius:14px; }
  .seg button { height:40px; border:0; border-radius:10px; background:transparent; color:var(--muted); font-size:15px; font-weight:600; }
  .seg button.on { background:var(--bg); color:var(--text); font-weight:700; box-shadow:0 1px 2px rgba(0,0,0,.08); }

  main { max-width:720px; margin:0 auto; padding:26px 16px 60px; display:flex; flex-direction:column; gap:28px; }
  .sec { display:flex; flex-direction:column; gap:12px; }
  .sec h2 { margin:0; display:flex; align-items:center; gap:10px; font-family:var(--display); font-size:17px; font-weight:700; }
  .cnt { min-width:24px; height:24px; padding:0 7px; border-radius:999px; background:var(--ink); color:var(--ink-t);
    font:700 13px/24px Inter, sans-serif; text-align:center; }
  .cnt.warn { background:var(--warn-dot); color:#fff; }
  .hint { margin:-4px 0 0; font-size:13px; color:var(--muted); }
  .empty-all { padding:40px 8px; text-align:center; color:var(--muted); }

  /* ---------- карточки ---------- */
  .card { display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:16px; border:1.5px solid var(--line); border-radius:22px;
    background:transparent; color:var(--text); transition:transform .12s ease; }
  .card:active { transform:scale(.985); }
  .card .main { flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:4px; }
  .t { font-size:17px; font-weight:700; letter-spacing:-.005em; }
  .a { font-size:14px; color:var(--muted); }
  .d { font-size:14px; color:var(--text2); }
  .one { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .take { flex:0 0 auto; display:flex; align-items:center; gap:4px; height:40px; padding:0 14px 0 10px; border:0; border-radius:999px;
    background:var(--ink); color:var(--ink-t); font-size:14px; font-weight:650; }
  .owner { align-self:flex-start; margin-top:4px; padding:3px 9px; border-radius:999px; background:var(--card); font-size:12px; font-weight:650; color:var(--text2); }
  .owner.me { background:var(--ink); color:var(--ink-t); }

  .act { flex-direction:column; align-items:stretch; gap:12px; border:0; background:var(--card); }
  .act.warn { background:var(--warn-bg); }
  .act .why { display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:13px; font-weight:700; color:var(--text2); }
  .act.warn .why { color:var(--warn-t); }
  .act .why span { display:flex; align-items:center; gap:6px; }
  .act .why em { font-style:normal; font-weight:600; color:var(--muted); white-space:nowrap; }
  .act.warn .why em { color:var(--warn-t); }
  .go { display:flex; align-items:center; justify-content:center; gap:6px; height:44px; border-radius:14px; font-size:15px; font-weight:650;
    background:var(--ink); color:var(--ink-t); }
  .go.line { background:var(--bg); color:var(--text); box-shadow:inset 0 0 0 1.5px var(--ink); }

  .day { margin-top:4px; font-size:13px; font-weight:700; letter-spacing:.06em; color:var(--muted); text-transform:uppercase; }
  .meet { display:grid; grid-template-columns:76px minmax(0,1fr) 20px; align-items:center; gap:12px; width:100%; text-align:left;
    padding:12px 0 16px; border:0; border-bottom:1.5px solid var(--line); background:transparent; color:var(--text); }
  .meet .tm { font-family:var(--display); font-size:22px; font-weight:700; letter-spacing:-.01em; font-variant-numeric:tabular-nums; }
  .meet .main { display:flex; flex-direction:column; gap:3px; min-width:0; }
  .pill { align-self:flex-start; margin-top:4px; padding:3px 9px; border-radius:999px; background:var(--ink); color:var(--ink-t); font-size:12px; font-weight:650; }
  .pill.soft { background:var(--card); color:var(--text2); }
  .pill.warn { background:var(--warn-chip); color:var(--warn-t); }

  .fold { display:flex; align-items:center; justify-content:space-between; height:56px; padding:0 18px; border:0; border-radius:18px;
    background:var(--card); color:var(--text); font-size:15px; font-weight:650; }
  .fold span { display:flex; align-items:center; gap:10px; }
  .fold em { font-style:normal; font-size:14px; font-weight:600; color:var(--muted); }
  .done-row { display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:14px 18px; border:1.5px solid var(--line); border-radius:18px;
    background:transparent; color:var(--text); }
  .done-row .main { flex:1 1 auto; display:flex; flex-direction:column; gap:3px; min-width:0; }

  /* ---------- шторка ---------- */
  dialog { border:0; padding:0; margin:auto 0 0; width:100%; max-width:100%; max-height:94dvh; background:var(--sheet); color:var(--text);
    border-radius:26px 26px 0 0; overflow:hidden; }
  @media (min-width:700px) { dialog { margin:auto; width:560px; border-radius:26px; max-height:90vh; } }
  dialog[open] { animation:up .28s cubic-bezier(.2,.8,.2,1); }
  dialog::backdrop { background:rgba(0,0,0,.4); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); }
  @keyframes up { from { transform:translateY(40px); opacity:0; } to { transform:none; opacity:1; } }
  .grab { width:40px; height:5px; border-radius:3px; background:var(--line2); margin:10px auto 0; }
  .db { padding:12px 20px calc(28px + env(safe-area-inset-bottom)); overflow-y:auto; max-height:calc(94dvh - 20px);
    -webkit-overflow-scrolling:touch; display:flex; flex-direction:column; gap:20px; }
  .db > *, #pk > * { flex-shrink:0; }
  .dh { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .dh > div { display:flex; flex-direction:column; gap:6px; min-width:0; }
  .dh h3 { margin:0; font-family:var(--display); font-size:23px; line-height:1.2; font-weight:700; letter-spacing:-.01em; overflow-wrap:anywhere; }
  .status { align-self:flex-start; display:flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; background:var(--card);
    font-size:13px; font-weight:600; color:var(--text2); }
  .status.ink { background:var(--ink); color:var(--ink-t); }
  .status.warn { background:var(--warn-chip); color:var(--warn-t); font-weight:650; }
  .x { flex:0 0 auto; width:44px; height:44px; border:0; border-radius:50%; background:var(--card); display:flex; align-items:center; justify-content:center; color:var(--text); }

  .steps { margin:0; padding:0; list-style:none; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; }
  .steps li { display:flex; flex-direction:column; gap:6px; font-size:12px; font-weight:500; color:var(--muted); }
  .steps li::before { content:""; height:4px; border-radius:2px; background:var(--line2); }
  .steps li.on::before { background:var(--ink); }
  .steps li.cur { color:var(--text); font-weight:700; }

  .grp { display:flex; flex-direction:column; border-radius:18px; background:var(--card); overflow:hidden; }
  .row { display:flex; align-items:center; gap:12px; padding:14px 16px; color:var(--text); text-decoration:none; }
  .row + .row { border-top:1px solid var(--line2); }
  .row.top-al { align-items:flex-start; }
  .row .main { flex:1 1 auto; display:flex; flex-direction:column; gap:2px; min-width:0; }
  .lbl { font-size:12px; font-weight:600; color:var(--muted); }
  .val { font-size:15px; font-weight:500; overflow-wrap:anywhere; }
  .pre { white-space:pre-wrap; line-height:1.45; }
  .mini { flex:0 0 auto; padding:8px 14px; border-radius:999px; background:var(--bg); font-size:14px; font-weight:600; color:var(--text); text-decoration:none; }

  .hero { display:flex; flex-direction:column; gap:14px; padding:20px; border-radius:20px; background:var(--hero); color:var(--hero-t); }
  .hero .r1 { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .hero .when { font-size:13px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--hero-2); }
  .hero .left { padding:4px 10px; border-radius:999px; background:var(--hero-chip); font-size:13px; font-weight:600; }
  .hero .big { font-family:var(--display); font-size:46px; line-height:1; font-weight:700; letter-spacing:-.02em; }
  .hero .ev { font-size:17px; font-weight:600; }
  .hero.light { background:var(--card); color:var(--text); }
  .hero.light .when { color:var(--muted); }
  .hero.light .left { background:var(--bg); }

  .two { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
  .btn { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; min-height:54px; border:0; border-radius:16px;
    font-size:16px; font-weight:650; text-decoration:none; background:var(--card); color:var(--text); }
  .btn.primary { background:var(--ink); color:var(--ink-t); }
  .btn.line { background:transparent; box-shadow:inset 0 0 0 1.5px var(--line2); }
  .btn.plain { min-height:44px; background:transparent; color:var(--muted); font-size:14px; font-weight:600; }
  .btn:active { opacity:.8; }
  .btn:disabled { opacity:.5; }
  .note { margin:0; display:flex; gap:10px; font-size:14px; line-height:1.45; color:var(--text2); }
  .center { text-align:center; justify-content:center; font-size:13px; color:var(--muted); }

  .field { display:flex; flex-direction:column; gap:8px; }
  .field label, .field .lab { font-size:16px; font-weight:700; }
  .field .help { font-size:13px; color:var(--muted); margin-top:-2px; }
  input[type=text], textarea { width:100%; border:1.5px solid var(--line2); border-radius:14px; background:var(--bg); color:var(--text);
    font-size:16px; outline:none; -webkit-appearance:none; appearance:none; }
  input[type=text] { height:52px; padding:0 16px; }
  textarea { min-height:120px; padding:14px 16px; line-height:1.45; resize:vertical; }
  input[type=text]:focus, textarea:focus { border-color:var(--ink); }
  input::placeholder, textarea::placeholder { color:var(--faint); }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chips button { padding:7px 12px; border:0; border-radius:999px; background:var(--card); color:var(--text2); font-size:13px; font-weight:600; }

  /* барабаны */
  .wheels { position:relative; height:220px; border-radius:20px; border:1.5px solid var(--line); overflow:hidden; display:flex; padding:0 8px; }
  .band { position:absolute; left:8px; right:8px; top:88px; height:44px; border-radius:12px; background:var(--card); pointer-events:none; }
  .wheel { position:relative; height:220px; overflow-y:scroll; scroll-snap-type:y mandatory; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
    padding:88px 0; scrollbar-width:none;
    -webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent); mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent); }
  .wheel::-webkit-scrollbar { display:none; }
  .wheel.d { flex:2 1 0; } .wheel.n { flex:1 1 0; }
  .wheel .it { height:44px; display:flex; align-items:center; justify-content:center; white-space:nowrap; scroll-snap-align:center; scroll-snap-stop:always;
    color:var(--faint); font-size:15px; font-weight:500; font-variant-numeric:tabular-nums; }
  .wheel.n .it { font-size:18px; }
  .wheel .it.sel { color:var(--text); font-weight:700; font-size:16px; }
  .wheel.n .it.sel { font-family:var(--display); font-size:20px; }
  .colon { position:relative; align-self:center; font-family:var(--display); font-size:20px; font-weight:700; }
  .sum { display:flex; align-items:center; gap:12px; padding:14px 16px; border-radius:16px; background:var(--card); }
  .sum b { display:block; font-size:16px; }

  #toast { position:fixed; left:50%; top:calc(14px + env(safe-area-inset-top)); transform:translate(-50%,-20px); background:var(--ink); color:var(--ink-t);
    padding:11px 18px; border-radius:30px; font-size:14px; font-weight:600; opacity:0; pointer-events:none; transition:all .25s ease; max-width:90vw; z-index:99; text-align:center; }
  #toast.show { opacity:1; transform:translate(-50%,0); }
  .gate { max-width:420px; margin:60px auto; padding:0 24px; text-align:center; color:var(--muted); }
</style>
</head>
<body>
<div class="top">
  <div class="bar">
    <span class="brand">ЗАДАЧИ БА</span>
    <span id="sync"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5 10 17 19 7"/></svg><span>загрузка…</span></span>
  </div>
  <div class="hello">
    <span id="today"></span>
    <h1 id="who">&nbsp;</h1>
    <p id="sub"></p>
  </div>
  <div class="seg" id="seg" role="tablist"><button data-f="mine" role="tab">Мои</button><button data-f="all" role="tab">Все</button></div>
</div>
<main id="list"><div class="empty-all">Загрузка…</div></main>
<dialog id="dlg"><div class="grab"></div><div id="dlgBody"></div></dialog>
<div id="toast"></div>
<script>
/* ===== НАСТРОЙКА ===== */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbya4k0DQmu5HXcXJMoFq_vqcx2gmw0ajSIqf6cf-WGBKE01D2aDbHZ4hfUuLEx4RCqKqw/exec',
  POLL_MS: 10000,   // как часто обновлять (мс)
  MEETING_HOURS: 2.5, // через сколько часов после начала встреча считается законченной (как в боте)
  CITY: ''          // например 'Самара' — уточняет ссылку на карту
};
/* ==================== */

const ST = { WAIT:'ожидает', WORK:'в работе', SCHED:'назначена дата', DONE:'выполнена' };
const GROUPS = [
  { s: ST.WAIT,  title: 'Ожидают',        full: 'Ожидает взятия в работу', cls: 'wait' },
  { s: ST.WORK,  title: 'В работе',       full: 'Взята в работу',          cls: 'work' },
  { s: ST.SCHED, title: 'Назначена дата', full: 'Назначена дата',          cls: 'sched' },
  { s: ST.DONE,  title: 'Выполнены',      full: 'Выполнена',               cls: 'done' }
];

const KEY = new URLSearchParams(location.search).get('k') || '';
const $ = (id) => document.getElementById(id);
const state = { points: [], json: '', user: '', openId: null, sig: '', busy: false, loading: false,
                filter: 'mine', showDone: false, justScheduled: null, showResults: false, pk: null,
                pending: 0, seq: 0, ts: 0, queue: [], fails: 0, flushing: false, flushAt: 0 };

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = (n) => String(n).padStart(2, '0');
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

function fmtDate(s) {
  if (!s) return '';
  const d = new Date(s);
  if (isNaN(d)) return s;
  return cap(d.toLocaleString('ru-RU', { weekday:'short', day:'numeric', month:'long' })) + ' · ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function linkify(text) {
  return esc(text).replace(/(\+?[78][\s\d()\-]{9,}\d)/g, (m) => `<a href="tel:${m.replace(/[^\d+]/g, '')}">${m}</a>`);
}
function mapUrl(p) {
  return 'https://yandex.ru/maps/?text=' + encodeURIComponent([CONFIG.CITY, p.address].filter(Boolean).join(', '));
}
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 3200);
}
function setSync(ok, msg) {
  const el = $('sync');
  el.classList.toggle('bad', !ok);
  el.querySelector('span').textContent = ok ? 'Всё сохранено' : 'нет связи' + (msg ? ' · ' + msg : '');
}

/* ---------- календарь iPhone (.ics) ---------- */
function icsText(p) {
  const s = new Date(p.date), e = new Date(s.getTime() + 3600e3);
  const f = (d) => `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const t = (x) => String(x || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
  const fold = (line) => {
    const ch = Array.from(line), out = [];
    for (let i = 0; i < ch.length; i += 60) out.push((i ? ' ' : '') + ch.slice(i, i + 60).join(''));
    return out.join('\r\n');
  };
  return [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Tochki//RU', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
    'BEGIN:VEVENT',
    `UID:${p.id}-${f(s)}@tochki`, `DTSTAMP:${stamp}`, `DTSTART:${f(s)}`, `DTEND:${f(e)}`,
    `SUMMARY:${t((p.event ? p.event + ' — ' : 'Встреча: ') + p.name)}`, `LOCATION:${t(p.address)}`,
    `DESCRIPTION:${t([p.contact, p.task].filter(Boolean).join('\n\n'))}`,
    'BEGIN:VALARM', 'TRIGGER:-PT60M', 'ACTION:DISPLAY', 'DESCRIPTION:Встреча через час', 'END:VALARM',
    'END:VEVENT', 'END:VCALENDAR'
  ].map(fold).join('\r\n');
}
function addToCalendar(p) {
  const ics = icsText(p);
  if (isIOS) {                                   // iPhone: откроется окно «Добавить в Календарь»
    const a = document.createElement('a');
    a.href = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics);
    a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
  } else {                                       // компьютер: скачается .ics
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar;charset=utf-8' }));
    a.download = 'vstrecha.ics';
    document.body.appendChild(a); a.click(); a.remove();
  }
}

/* ---------- сеть ---------- */
const POST_HDR = { 'Content-Type': 'text/plain;charset=utf-8' };   // без preflight
const OUT_KEY = 'outbox:' + KEY;

// fetch с таймаутом: на iPhone запрос может «зависнуть» при сворачивании Safari и заблокировать обновления навсегда
async function fetchJson(url, opts, ms) {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), ms);
  try { const r = await fetch(url, { ...opts, signal: c.signal }); return await r.json(); }
  finally { clearTimeout(t); }
}

/* Очередь отправки: действие сначала сохраняется на телефоне и уходит на сервер с повторами,
   поэтому его не потерять, даже если закрыть сайт или пропадёт связь. */
function persistQueue() {
  try { localStorage.setItem(OUT_KEY, JSON.stringify(state.queue)); } catch {}
  state.pending = state.queue.length;
  showBadge();
}
function showBadge() {
  if (!state.pending) return;
  const el = $('sync'); el.classList.remove('bad');
  el.querySelector('span').textContent = 'Сохраняю…';
}

// Локальное (мгновенное) применение действия
function applyLocal(p, action, x) {
  const q = { ...p };
  if (action === 'take') { q.status = ST.WORK; q.owner = state.user; }
  else if (action === 'release') { q.status = ST.WAIT; q.owner = ''; q.date = ''; q.event = ''; }
  else if (action === 'schedule') { q.status = ST.SCHED; q.date = x.date; if (x.event !== undefined) q.event = x.event; }
  else if (action === 'complete') { q.status = ST.DONE; q.discussed = x.discussed; q.result = x.result; q.expectation = x.expectation; q.done = new Date().toISOString(); }
  return q;
}
function overlay(points) {      // серверные данные + ещё не отправленные действия
  return state.queue.reduce((pts, it) => pts.map(p => p.id === it.id ? applyLocal(p, it.action, it.extra || {}) : p), points);
}

function act(action, extra, id) {
  id = id || state.openId;
  state.seq++;
  state.queue.push({ oid: Date.now() + '-' + Math.random().toString(36).slice(2, 7), action, id, extra: extra || {}, tries: 0 });
  persistQueue();
  setPoints(state.points.map(p => p.id === id ? applyLocal(p, action, extra || {}) : p));
  refreshDialog(true);
  flush();
}

async function flush() {
  if (state.flushing && Date.now() - state.flushAt < 45000) return;
  if (!state.queue.length) return;
  state.flushing = true; state.flushAt = Date.now();
  let failed = false;
  try {
    while (state.queue.length) {
      const it = state.queue[0];
      let d;
      try {
        d = await fetchJson(CONFIG.API_URL, { method: 'POST', headers: POST_HDR,
          body: JSON.stringify({ k: KEY, action: it.action, id: it.id, ...it.extra }) }, 30000);
      } catch (e) {                                  // нет связи / обрыв: оставляем в очереди и повторяем
        setSync(false, 'не отправлено, повторю');
        setTimeout(flush, 4000);
        return;
      }
      if (d.error === 'auth') return gate('Ключ доступа не подошёл. Откройте сайт по своей персональной ссылке.');
      if (!d.ok && !d.points) {                      // сбой на стороне Google (не отказ по правилам) — повторяем
        it.tries = (it.tries || 0) + 1;
        if (it.tries < 5) { persistQueue(); setSync(false, 'повторю'); setTimeout(flush, 4000); return; }
      }
      state.queue = state.queue.filter(x => x.oid !== it.oid);
      persistQueue();
      state.seq++;
      if (d.points) acceptServer(d);
      if (d.ok) { if (it.action === 'complete') { try { localStorage.removeItem(draftKey(it.id)); } catch {} } }
      else { failed = true; toast(d.error || 'Не удалось сохранить'); if (state.justScheduled === it.id) state.justScheduled = null; }
    }
  } finally { state.flushing = false; }
  state.pending = 0;
  setSync(true);
  const waiting = $('dlgBody').querySelector('[data-act=ics][disabled]');
  refreshDialog(failed || !!waiting);
}

async function load() {
  if (state.loading || state.pending) return;
  state.loading = true;
  const seq = state.seq;
  try {
    const d = await fetchJson(`${CONFIG.API_URL}?action=list&k=${encodeURIComponent(KEY)}&t=${Date.now()}`, {}, 15000);
    if (!d.ok) throw new Error(d.error);
    state.fails = 0;
    if (state.seq === seq && !state.pending) applyData(d);   // ответ устарел, если за это время было действие
    setSync(true);
  } catch (e) {
    if (String(e.message) === 'auth') return gate('Ключ доступа не подошёл. Откройте сайт по своей персональной ссылке.');
    if (++state.fails >= 2) setSync(false);                  // одиночный сбой не показываем
  } finally { state.loading = false; }
}

function setPoints(points) {
  const j = JSON.stringify(points);
  if (j !== state.json) { state.json = j; state.points = points; render(); }
}

function acceptServer(d) {
  if (d.ts && d.ts < state.ts) return;          // более старый ответ — игнорируем
  state.ts = d.ts || state.ts;
  try { localStorage.setItem('cache:' + KEY, JSON.stringify({ user: state.user, points: d.points })); } catch {}
  setPoints(state.queue.length ? overlay(d.points) : d.points);
}

function applyData(d) {
  state.user = d.user || state.user;
  $('who').textContent = state.user;
  acceptServer(d);
  refreshDialog(false);
  openDeepLink();
}

/* Ссылка из Telegram вида ?k=КЛЮЧ&p=ID_ТОЧКИ открывает эту точку
   (и сразу форму итогов, если встреча назначена на вас). Срабатывает один раз. */
let DEEP_ID = new URLSearchParams(location.search).get('p') || '';
function openDeepLink() {
  if (!DEEP_ID) return;
  const id = DEEP_ID; DEEP_ID = '';
  try { history.replaceState(null, '', location.pathname + '?k=' + encodeURIComponent(KEY)); } catch {}
  const p = state.points.find(x => x.id === id);
  if (!p) return toast('Точка не найдена — возможно, её удалили');
  openDialog(id);
  if (p.status === ST.SCHED && p.owner === state.user) {
    state.showResults = true; renderDialog();
    setTimeout(() => $('f1')?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 250);
  }
  else if (p.status === ST.DONE) toast('Итоги по этой встрече уже внесены');
}

};

/* ---------- даты и тексты ---------- */
const WD = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
const MON = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'нояб', 'дек'];
const MONF = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const WDF = ['воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'];
const day0 = (d) => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
const dayDiff = (d) => Math.round((day0(d) - day0(new Date())) / 864e5);
const hm = (d) => pad(d.getHours()) + ':' + pad(d.getMinutes());
const validDate = (s) => { const d = new Date(s); return s && !isNaN(d) ? d : null; };
function relDay(d) {
  const n = dayDiff(d);
  return n === 0 ? 'сегодня' : n === 1 ? 'завтра' : n === -1 ? 'вчера' : WD[d.getDay()] + ', ' + d.getDate() + ' ' + MON[d.getMonth()];
}
function dayHead(d) {                     // «Сегодня · пт 30»
  const n = dayDiff(d), wd = WD[d.getDay()] + ' ' + d.getDate();
  return n === 0 ? 'Сегодня · ' + wd : n === 1 ? 'Завтра · ' + wd : n === -1 ? 'Вчера · ' + wd : WDF[d.getDay()] + ', ' + d.getDate() + ' ' + MONF[d.getMonth()];
}
function dayFull(d) {                     // «Сегодня, пт 30 октября»
  const n = dayDiff(d), base = WD[d.getDay()] + ' ' + d.getDate() + ' ' + MONF[d.getMonth()];
  return n === 0 ? 'Сегодня, ' + base : n === 1 ? 'Завтра, ' + base : n === -1 ? 'Вчера, ' + base : cap(base);
}
const whenShort = (s) => { const d = validDate(s); return d ? relDay(d) + ', ' + hm(d) : ''; };
function leftText(d) {
  const ms = d - Date.now();
  if (ms <= 0) return 'идёт сейчас';
  const m = Math.round(ms / 6e4);
  if (m < 60) return 'через ' + m + ' мин';
  const h = Math.round(m / 60);
  if (h < 24) return 'через ' + h + ' ч';
  return 'через ' + Math.round(h / 24) + ' дн';
}
function plural(n, f) { const a = n % 10, b = n % 100; return f[a === 1 && b !== 11 ? 0 : a >= 2 && a <= 4 && (b < 10 || b >= 20) ? 1 : 2]; }
const oneLine = (s) => String(s || '').replace(/\s*\n\s*/g, ' ').replace(/•\s*/g, '').trim();
function phoneOf(s) { const m = String(s || '').match(/\+?[78][\s\d()\-]{9,}\d/); return m ? m[0].replace(/[^\d+]/g, '') : ''; }
const started = (p) => { const d = validDate(p.date); return !!d && Date.now() >= d.getTime(); };

/* ---------- список ---------- */
function section(title, n, body, warnCnt) {
  if (!n) return '';
  return `<section class="sec"><h2>${title} <span class="cnt ${warnCnt ? 'warn' : ''}">${n}</span></h2>${body}</section>`;
}
function cardFree(p) {
  return `<button class="card" data-id="${esc(p.id)}">
      <span class="main"><span class="t">${esc(p.name)}</span>
        ${p.address ? `<span class="a">${esc(p.address)}</span>` : ''}
        ${p.task ? `<span class="d one">${esc(oneLine(p.task))}</span>` : ''}</span>
      <span class="take" data-take="${esc(p.id)}" role="button" aria-label="Взять ${esc(p.name)} в работу">${I.plus()}Взять</span>
    </button>`;
}
function cardAction(p) {
  if (needsResults(p)) {
    return `<button class="card act warn" data-id="${esc(p.id)}">
        <span class="why"><span>${I.warn()} Встреча прошла, итогов нет</span><em>${esc(whenShort(p.date))}</em></span>
        <span class="main"><span class="t">${esc(p.name)}</span><span class="d">${esc([p.event, p.address].filter(Boolean).join(' · '))}</span></span>
        <span class="go">Внести итоги ${I.arrow()}</span>
      </button>`;
  }
  return `<button class="card act" data-id="${esc(p.id)}">
      <span class="why"><span>${I.phone()} Созвонитесь и назначьте встречу</span></span>
      <span class="main"><span class="t">${esc(p.name)}</span>${p.address ? `<span class="d">${esc(p.address)}</span>` : ''}</span>
      <span class="go line">Назначить встречу ${I.arrow()}</span>
    </button>`;
}
function cardWork(p) {
  return `<button class="card" data-id="${esc(p.id)}">
      <span class="main"><span class="t">${esc(p.name)}</span>${p.address ? `<span class="a">${esc(p.address)}</span>` : ''}
        <span class="owner ${p.owner === state.user ? 'me' : ''}">${esc(p.owner)}</span></span>${I.chev()}
    </button>`;
}
function meetings(list, showOwner) {
  let html = '', last = '';
  list.forEach(p => {
    const d = validDate(p.date);
    const head = d ? dayHead(d) : 'Без даты';
    if (head !== last) { html += `<span class="day">${esc(head)}</span>`; last = head; }
    let pill = '';
    if (needsResults(p)) pill = `<span class="pill warn">Внесите итоги</span>`;
    else if (d && Date.now() >= d.getTime() + CONFIG.MEETING_HOURS * 3600e3) pill = `<span class="pill soft">прошла</span>`;
    else if (d && started(p)) pill = `<span class="pill soft">идёт сейчас</span>`;
    else if (d && dayDiff(d) === 0) pill = `<span class="pill">${leftText(d)}</span>`;
    const owner = showOwner ? `<span class="owner ${p.owner === state.user ? 'me' : ''}">${esc(p.owner)}</span>` : '';
    html += `<button class="meet" data-id="${esc(p.id)}">
        <span class="tm">${d ? hm(d) : '—'}</span>
        <span class="main"><span class="t">${esc(p.name)}</span>
          <span class="d">${esc([p.event, p.address].filter(Boolean).join(' · '))}</span>${pill}${owner}</span>${I.chev()}
      </button>`;
  });
  return html;
}
function doneBlock(list, showOwner) {
  if (!list.length) return '';
  const rows = state.showDone ? list.map(p => `
      <button class="done-row" data-id="${esc(p.id)}"><span class="main"><span class="t" style="font-size:15px">${esc(p.name)}</span>
        <span class="a">${showOwner ? esc(p.owner) + ' · ' : ''}итоги внесены${p.done && validDate(p.done) ? ' ' + validDate(p.done).getDate() + ' ' + MONF[validDate(p.done).getMonth()] : ''}</span></span>${I.chev()}</button>`).join('') : '';
  return `<section class="sec"><button class="fold" data-fold aria-expanded="${state.showDone}"><span>${I.done()} Выполнено · ${list.length}</span><em>${state.showDone ? 'Свернуть' : 'Показать'}</em></button>${rows}</section>`;
}
const byDate = (a, b) => String(a.date).localeCompare(String(b.date));
const byDone = (a, b) => String(b.done).localeCompare(String(a.done));

function render() {
  const me = state.user, all = state.filter === 'all', P = state.points;
  const free = P.filter(p => p.status === ST.WAIT);
  let html = section('Свободные', free.length, free.map(cardFree).join(''));
  const myAction = P.filter(p => p.owner === me && (p.status === ST.WORK || needsResults(p)))
    .sort((a, b) => (needsResults(b) - needsResults(a)) || byDate(a, b));

  if (!all) {
    const overdue = myAction.some(needsResults);
    html += section('Нужно действие', myAction.length, myAction.map(cardAction).join(''), overdue);
    const meets = P.filter(p => p.owner === me && p.status === ST.SCHED && !needsResults(p)).sort(byDate);
    html += section('Ближайшие встречи', meets.length, meetings(meets, false));
    html += doneBlock(P.filter(p => p.owner === me && p.status === ST.DONE).sort(byDone), false);
  } else {
    html += `<p class="hint">Видны точки всех сотрудников. Оранжевые отметки — только на ваших.</p>`;
    const work = P.filter(p => p.status === ST.WORK).sort((a, b) => a.owner.localeCompare(b.owner));
    html += section('В работе', work.length, work.map(cardWork).join(''));
    const meets = P.filter(p => p.status === ST.SCHED).sort(byDate);
    html += section('Встречи', meets.length, meetings(meets, true));
    html += doneBlock(P.filter(p => p.status === ST.DONE).sort(byDone), true);
  }
  $('list').innerHTML = html.trim() ? html : `<div class="empty-all">Пока нет точек</div>`;

  const n = myAction.length;
  $('sub').textContent = !me ? '' : n ? n + ' ' + plural(n, ['точка ждёт', 'точки ждут', 'точек ждут']) + ' вашего действия'
    : free.length ? 'Всё сделано — можно взять новую точку' : 'Всё сделано';
  state.warn = warnSig();
}

/* ---------- шторка ---------- */
// встреча по времени закончилась, а итоги не внесены — показываем только самому исполнителю
function needsResults(p) {
  if (p.status !== ST.SCHED || !p.date || p.owner !== state.user) return false;
  const t = new Date(p.date).getTime();
  return !isNaN(t) && Date.now() >= t + CONFIG.MEETING_HOURS * 3600e3;
}
const warnSig = () => state.points.filter(needsResults).map(p => p.id).join(',');

const sigOf = (p) => p ? [p.status, p.owner, p.date, p.event].join('|') : '';

function openDialog(id) {
  state.openId = id; state.justScheduled = null; state.showResults = false; state.pk = null;
  if (!$('dlg').open) $('dlg').showModal();
  renderDialog();
  const b = $('dlgBody').querySelector('.db'); if (b) b.scrollTop = 0;
}
function closeDialog() { if ($('dlg').open) $('dlg').close(); }

function refreshDialog(force) {
  if (!$('dlg').open) return;
  const p = state.points.find(x => x.id === state.openId);
  if (!p) { closeDialog(); toast('Точка удалена админом'); return; }
  if (force || sigOf(p) !== state.sig) {
    const changed = !force && state.sig;
    renderDialog();
    if (changed) toast('Точка изменилась — данные обновлены');
  }
}

const draftKey = (id) => 'draft:' + id;
function readDraft(id) { try { return JSON.parse(localStorage.getItem(draftKey(id)) || '{}'); } catch { return {}; } }
function saveDraft() {
  const o = { discussed: $('f1')?.value || '', result: $('f2')?.value || '', expectation: $('f3')?.value || '' };
  try { localStorage.setItem(draftKey(state.openId), JSON.stringify(o)); } catch {}
}

function steps(on, cur) {
  return `<ol class="steps" aria-label="Этапы">${['Взять', 'Встреча', 'Итоги'].map((s, i) =>
    `<li class="${i < on ? 'on' : ''} ${i + 1 === cur ? 'cur' : ''}" ${i + 1 === cur ? 'aria-current="step"' : ''}>${i + 1}. ${s}</li>`).join('')}</ol>`;
}
function infoGroup(p, withEvent) {
  const tel = phoneOf(p.contact);
  return `<div class="grp">
      ${withEvent && p.event ? `<div class="row">${I.tag()}<span class="main"><span class="lbl">Название мероприятия</span><span class="val">${esc(p.event)}</span></span></div>` : ''}
      <a class="row" href="${mapUrl(p)}" target="_blank" rel="noopener">${I.pin()}<span class="main"><span class="lbl">Адрес</span><span class="val">${esc(p.address) || '—'}</span></span><span class="lbl" style="font-size:14px">Карта</span></a>
      <div class="row">${I.user()}<span class="main"><span class="lbl">Контакт</span><span class="val pre">${esc(p.contact) || '—'}</span></span>${tel ? `<a class="mini" href="tel:${tel}">Позвонить</a>` : ''}</div>
      <div class="row top-al">${I.list()}<span class="main"><span class="lbl">Задача</span><span class="val pre">${esc(p.task) || '—'}</span></span></div>
    </div>`;
}
function hero(p, light) {
  const d = validDate(p.date);
  if (!d) return '';
  return `<div class="hero ${light ? 'light' : ''}">
      <div class="r1"><span class="when">${esc(dayFull(d))}</span><span class="left">${esc(leftText(d))}</span></div>
      <span class="big">${hm(d)}</span>
      ${p.event ? `<span class="ev">${esc(p.event)}</span>` : ''}
      ${light ? `<span class="a">Исполнитель: ${esc(p.owner)}</span>` : ''}
    </div>`;
}
function resultsForm(p) {
  const d = readDraft(p.id);
  const f = (n, label, help, ph, val) => `<div class="field"><label for="f${n}">${n}. ${label}</label><span class="help">${help}</span>
      <textarea id="f${n}" data-draft rows="5" placeholder="${ph}">${esc(val || '')}</textarea></div>`;
  return `<p class="note" style="font-size:15px">Опишите встречу подробно — эти ответы читает отдел продаж.</p>
    ${f(1, 'Что обсудили', 'С кем говорили, что показали и попробовали, какие были вопросы', 'Например: встретились с управляющим, представили новинку, продегустировали несколько вкусов…', d.discussed)}
    ${f(2, 'Какой итог встречи', 'К чему пришли, о чём договорились, что осталось открытым', 'Например: готовы ввести вкусы в меню, но ждут условия по поставке…', d.result)}
    ${f(3, 'Какой результат может ожидать отдел продаж', 'Что и когда может произойти, кому из продаж подключиться', 'Например: заказ на следующей неделе, нужен звонок менеджера до среды…', d.expectation)}
    <button class="btn primary" data-act="complete">Сохранить итоги</button>
    <p class="note center">${I.check()} Черновик сохраняется на телефоне</p>`;
}

function renderDialog() {
  const p = state.points.find(x => x.id === state.openId);
  if (!p) return;
  state.sig = sigOf(p);
  state.pk = null;
  const mine = p.owner === state.user;
  let status = '', sub = '', on = 1, cur = 1, body = '', picker = false;

  if (p.status === ST.WAIT) {
    status = `<span class="status">Свободна</span>`;
    body = infoGroup(p, false) + `<button class="btn primary" data-act="take">Беру в работу</button>
      <p class="note center">Дальше: созвонитесь с контактом и назначьте встречу</p>`;

  } else if (p.status === ST.WORK) {
    on = 2; cur = 2;
    if (mine) {
      status = `<span class="status ink">У вас в работе</span>`;
      body = infoGroup(p, false) + `<p class="note">${I.info()} Созвонитесь с контактом и договоритесь о встрече.</p>
        <div id="pk"></div>
        <button class="btn plain" data-act="release">Вернуть в очередь</button>`;
      picker = true;
    } else {
      status = `<span class="status">В работе у ${esc(p.owner)}</span>`;
      body = infoGroup(p, false);
    }

  } else if (p.status === ST.SCHED) {
    on = 2; cur = 2;
    if (mine && state.justScheduled === p.id) {
      status = `<span class="status ink">Встреча назначена</span>`;
      body = hero(p, false) + `
        <button class="btn primary" data-act="ics" ${state.pending ? 'disabled' : ''}>${I.calPlus()} ${state.pending ? 'Сохраняю встречу…' : 'Добавить в календарь'}</button>
        <button class="btn plain" data-act="close">Готово</button>`;
    } else if (mine && (started(p) || state.showResults)) {
      on = 3; cur = 3;
      status = needsResults(p) ? `<span class="status warn">${I.warn(14)} Внесите итоги</span>` : `<span class="status ink">Встреча назначена</span>`;
      sub = [p.event, whenShort(p.date), p.address].filter(Boolean).join(' · ');
      body = resultsForm(p) + `
        <div class="two"><button class="btn line" data-act="pick">${I.move()} Перенести</button><button class="btn line" data-act="release">Вернуть</button></div>
        <div id="pk"></div>` + infoGroup(p, false);
    } else if (mine) {
      status = `<span class="status ink">Встреча назначена</span>`;
      const d = validDate(p.date), remind = d ? new Date(d.getTime() + CONFIG.MEETING_HOURS * 3600e3) : null;
      body = hero(p, false) + `
        <div class="two">
          <button class="btn primary" data-act="ics" ${state.pending ? 'disabled' : ''}>${I.calPlus()} ${state.pending ? 'Сохраняю…' : 'В календарь'}</button>
          <button class="btn line" data-act="pick">${I.move()} Перенести</button>
        </div>
        <div id="pk"></div>` + infoGroup(p, false) + `
        <p class="note">${I.info()} После встречи здесь появится форма итогов.${remind ? ' Бот напомнит ' + esc(relDay(remind)) + ' в ' + hm(remind) + '.' : ''}</p>
        <button class="btn plain" data-act="results">Встреча уже прошла? Внести итоги</button>
        <button class="btn plain" data-act="release" style="margin-top:-16px">Вернуть в очередь</button>`;
    } else {
      status = `<span class="status">Встреча у ${esc(p.owner)}</span>`;
      body = hero(p, true) + infoGroup(p, false);
    }

  } else if (p.status === ST.DONE) {
    on = 3; cur = 0;
    status = `<span class="status ink">${I.check()} Выполнена</span>`;
    sub = [p.owner, p.date ? 'встреча ' + whenShort(p.date) : ''].filter(Boolean).join(' · ');
    body = `<div class="grp">
        ${p.event ? `<div class="row">${I.tag()}<span class="main"><span class="lbl">Название мероприятия</span><span class="val">${esc(p.event)}</span></span></div>` : ''}
        <div class="row top-al"><span class="main"><span class="lbl">1. Что обсудили</span><span class="val pre">${esc(p.discussed) || '—'}</span></span></div>
        <div class="row top-al"><span class="main"><span class="lbl">2. Итог встречи</span><span class="val pre">${esc(p.result) || '—'}</span></span></div>
        <div class="row top-al"><span class="main"><span class="lbl">3. Ожидание для отдела продаж</span><span class="val pre">${esc(p.expectation) || '—'}</span></span></div>
      </div>` + infoGroup(p, false);
  }

  $('dlgBody').innerHTML = `<div class="db">
      <div class="dh"><div>${status}<h3>${esc(p.name)}</h3>${sub ? `<span class="a">${esc(sub)}</span>` : ''}</div>
        <button class="x" data-act="close" aria-label="Закрыть">${I.close()}</button></div>
      ${steps(on, cur)}
      ${body}
    </div>`;
  if (picker) mountPicker(p);
}

/* ---------- назначение встречи: название + барабан ---------- */
const ROW = 44, DAYS_AHEAD = 60;
function eventSuggestions(cur) {
  const cnt = {};
  state.points.forEach(p => { const e = String(p.event || '').trim(); if (e) cnt[e] = (cnt[e] || 0) + 1; });
  return Object.keys(cnt).filter(e => e !== cur).sort((a, b) => cnt[b] - cnt[a]).slice(0, 4);
}
function mountPicker(p) {
  const today = day0(new Date());
  const days = Array.from({ length: DAYS_AHEAD }, (_, i) => { const d = new Date(today); d.setDate(today.getDate() + i); return d; });
  let base = validDate(p.date);
  if (!base || base < Date.now()) { base = new Date(today); base.setDate(today.getDate() + 1); base.setHours(12, 0, 0, 0); }
  const di = Math.max(0, Math.min(DAYS_AHEAD - 1, dayDiff(base)));
  state.pk = { days, d: di, h: base.getHours(), mi: Math.min(11, Math.round(base.getMinutes() / 5)) };
  const sugg = eventSuggestions(p.event);
  $('pk').innerHTML = `
    <div class="field" style="margin-bottom:20px"><label for="evName">Название мероприятия</label>
      <input id="evName" type="text" maxlength="300" value="${esc(p.event || '')}" placeholder="Например: презентация новинки">
      ${sugg.length ? `<div class="chips">${sugg.map(s => `<button type="button" data-ev="${esc(s)}">${esc(s)}</button>`).join('')}</div>` : ''}
    </div>
    <div class="field" style="margin-bottom:12px"><span class="lab">Дата и время</span>
      <div class="wheels"><div class="band"></div>
        <div class="wheel d" id="wd" role="listbox" aria-label="День"></div>
        <div class="wheel n" id="wh" role="listbox" aria-label="Часы"></div>
        <span class="colon" aria-hidden="true">:</span>
        <div class="wheel n" id="wm" role="listbox" aria-label="Минуты"></div>
      </div>
    </div>
    <div class="sum" style="margin-bottom:12px">${I.cal()}<span><span class="lbl">Встреча</span><b id="pkSum"></b></span></div>
    <button class="btn primary" data-act="schedule">${p.status === ST.SCHED ? 'Сохранить новое время' : 'Назначить встречу'}</button>`;
  buildWheel('wd', days.map((d, i) => i === 0 ? 'Сегодня' : i === 1 ? 'Завтра' : WD[d.getDay()] + ', ' + d.getDate() + ' ' + MON[d.getMonth()]), state.pk.d, (i) => { state.pk.d = i; });
  buildWheel('wh', Array.from({ length: 24 }, (_, i) => pad(i)), state.pk.h, (i) => { state.pk.h = i; });
  buildWheel('wm', Array.from({ length: 12 }, (_, i) => pad(i * 5)), state.pk.mi, (i) => { state.pk.mi = i; });
  updateSum();
}
function buildWheel(id, labels, val, onPick) {
  const el = $(id);
  el.innerHTML = labels.map((l, i) => `<div class="it" role="option" data-i="${i}">${l}</div>`).join('');
  const mark = (i) => {
    if (el._sel) { el._sel.classList.remove('sel'); el._sel.setAttribute('aria-selected', 'false'); }
    el._sel = el.children[i]; el._sel.classList.add('sel'); el._sel.setAttribute('aria-selected', 'true');
  };
  mark(val);
  requestAnimationFrame(() => { el.scrollTop = val * ROW; });
  let raf;
  el.addEventListener('scroll', () => {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      const i = Math.max(0, Math.min(labels.length - 1, Math.round(el.scrollTop / ROW)));
      mark(i); onPick(i); updateSum();
    });
  });
  el.addEventListener('click', (e) => {
    const it = e.target.closest('.it');
    if (it) el.scrollTo({ top: it.dataset.i * ROW, behavior: 'smooth' });
  });
}
function pkDate() {
  const k = state.pk, d = new Date(k.days[k.d]);
  d.setHours(k.h, k.mi * 5, 0, 0);
  return d;
}
function updateSum() {
  if (!state.pk || !$('pkSum')) return;
  const d = pkDate();
  $('pkSum').textContent = dayFull(d) + ' · ' + hm(d);
}

/* ---------- события ---------- */
$('list').addEventListener('click', (e) => {
  const tk = e.target.closest('[data-take]');
  if (tk) {
    const id = tk.dataset.take;
    act('take', {}, id);
    toast('Точка взята — назначьте встречу');
    return openDialog(id);
  }
  if (e.target.closest('[data-fold]')) { state.showDone = !state.showDone; return render(); }
  const c = e.target.closest('[data-id]'); if (c) openDialog(c.dataset.id);
});
function setFilter(f) {
  state.filter = f;
  try { localStorage.setItem('filter:' + KEY, f); } catch {}
  document.querySelectorAll('#seg button').forEach(x => { const on = x.dataset.f === f; x.classList.toggle('on', on); x.setAttribute('aria-selected', on); });
}
$('seg').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  setFilter(b.dataset.f); render();
});
$('dlg').addEventListener('click', (e) => { if (e.target === $('dlg')) closeDialog(); });
$('dlg').addEventListener('close', () => { state.openId = null; state.sig = ''; state.justScheduled = null; state.showResults = false; state.pk = null; });
$('dlgBody').addEventListener('input', (e) => { if (e.target.matches('[data-draft]')) saveDraft(); });

$('dlgBody').addEventListener('click', async (e) => {
  const ev = e.target.closest('[data-ev]');
  if (ev) { $('evName').value = ev.dataset.ev; return; }

  const btn = e.target.closest('[data-act]'); if (!btn) return;
  const a = btn.dataset.act;
  const p = state.points.find(x => x.id === state.openId);

  if (a === 'close') return closeDialog();

  if (a === 'take') {
    const id = state.openId;
    act('take', {}, id);                                   // шторка остаётся: сразу можно назначить встречу
    toast('Точка взята — назначьте встречу');
  }
  else if (a === 'pick') {
    btn.closest('.two')?.querySelectorAll('[data-act=pick]').forEach(b => b.disabled = true);
    mountPicker(p);
    setTimeout(() => $('pk').scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
  }
  else if (a === 'schedule') {
    if (!state.pk) return;
    const when = pkDate();
    const event = ($('evName')?.value || '').trim().replace(/\s+/g, ' ');
    if (!event) { $('evName')?.focus(); return toast('Укажите название мероприятия'); }
    if (when.getTime() < Date.now() - 60000) return toast('Это время уже прошло');
    const iso = `${when.getFullYear()}-${pad(when.getMonth() + 1)}-${pad(when.getDate())}T${pad(when.getHours())}:${pad(when.getMinutes())}`;
    state.justScheduled = state.openId;
    act('schedule', { date: iso, event });                 // экран подтверждения появляется сразу
  }
  else if (a === 'ics') { if (p && p.date) addToCalendar(p); }
  else if (a === 'results') { state.showResults = true; renderDialog(); setTimeout(() => $('f1')?.focus(), 50); }
  else if (a === 'release') {
    if (confirm('Вернуть точку в очередь? Дата встречи сбросится.')) {
      const id = state.openId;
      closeDialog(); toast('Точка возвращена в очередь');
      act('release', {}, id);
    }
  }
  else if (a === 'complete') {
    const body = { discussed: $('f1').value, result: $('f2').value, expectation: $('f3').value };
    if (!body.discussed.trim() || !body.result.trim() || !body.expectation.trim()) return toast('Заполните все три пункта');
    const id = state.openId;
    closeDialog(); toast('Итоги сохранены');
    act('complete', body, id);                              // черновик удалится после подтверждения сервером
  }
});

function gate(msg) {
  $('seg').remove(); $('sub').textContent = ''; $('today').textContent = '';
  $('list').innerHTML = `<div class="gate">${esc(msg)}</div>`;
  clearInterval(state.timer);
  $('sync').style.display = 'none';
}

/* ---------- старт ---------- */
$('today').textContent = cap(new Date().toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' }));
if (!KEY) gate('Откройте сайт по своей персональной ссылке (с ключом после «?k=»).');
else {
  let f = 'mine'; try { f = localStorage.getItem('filter:' + KEY) || 'mine'; } catch {}
  setFilter(f === 'all' ? 'all' : 'mine');
  try { state.queue = JSON.parse(localStorage.getItem(OUT_KEY) || '[]'); } catch { state.queue = []; }
  state.pending = state.queue.length;
  try {                                          // прошлые данные + неотправленные действия — сразу, пока грузятся свежие
    const c = JSON.parse(localStorage.getItem('cache:' + KEY) || 'null');
    if (c && c.points) { state.user = c.user || ''; $('who').textContent = state.user; setPoints(overlay(c.points)); render(); }
  } catch {}
  showBadge();
  flush();
  load();
  state.timer = setInterval(() => {
    if (document.hidden) return;
    flush(); load();
    const w = warnSig();                       // отметка «Внесите итоги» появляется по времени, без новых данных
    if (w !== state.warn) { state.warn = w; render(); refreshDialog(true); }
  }, CONFIG.POLL_MS);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { state.loading = false; flush(); load(); } });
  window.addEventListener('online', () => { flush(); load(); });
}
</script>
</body>
</html>
