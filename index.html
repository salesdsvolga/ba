<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Задачи БА">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Задачи БА</title>
<style>
  :root {
    color-scheme: light dark;
    --bg:#ffffff; --card:#f4f4f5; --sheet:#ffffff; --text:#0a0a0a; --muted:#8a8a90;
    --line:#e7e7ea; --ink:#0a0a0a; --ink-t:#ffffff; --soft:rgba(10,10,10,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#000000; --card:#151517; --sheet:#1c1c1e; --text:#f5f5f7; --muted:#8e8e93;
            --line:#2a2a2d; --ink:#ffffff; --ink-t:#000000; --soft:rgba(255,255,255,.08); }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--text);
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  button { font:inherit; color:inherit; }

  /* ---------- шапка ---------- */
  header { max-width:720px; margin:0 auto; padding:22px 20px 6px; display:flex; justify-content:space-between; align-items:flex-end; gap:12px; }
  h1 { margin:0; font-size:34px; line-height:1.05; letter-spacing:-.03em; font-weight:800; }
  #who { color:var(--text); font-size:26px; line-height:1.15; font-weight:700; letter-spacing:-.02em; margin-top:8px; }
  #sync { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); padding-bottom:6px; white-space:nowrap; }
  #sync i { width:7px; height:7px; border-radius:50%; background:var(--ink); display:inline-block; }
  #sync.bad i { background:transparent; border:1.5px solid var(--muted); }

  .tools { max-width:720px; margin:0 auto; padding:14px 20px 0; display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .seg { display:inline-flex; background:var(--card); border-radius:12px; padding:3px; }
  .seg button { border:0; background:transparent; padding:7px 18px; border-radius:9px; font-size:14px; font-weight:600; color:var(--muted); cursor:pointer; }
  .seg button.on { background:var(--ink); color:var(--ink-t); }
  #stats { font-size:13px; color:var(--muted); }

  main { max-width:720px; margin:0 auto; padding:4px 20px 60px; }
  h2 { margin:28px 0 10px; font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); display:flex; align-items:center; gap:8px; }
  h2 .n { font-size:12px; background:var(--soft); color:var(--text); min-width:22px; text-align:center; padding:1px 7px; border-radius:20px; letter-spacing:0; }
  .empty { color:var(--muted); font-size:14px; padding:2px 2px 0; }

  /* ---------- карточки ---------- */
  .card { background:var(--card); border-radius:20px; padding:15px 16px; margin-bottom:10px; display:flex; gap:14px;
    align-items:center; justify-content:space-between; cursor:pointer; transition:transform .12s ease; }
  .card:active { transform:scale(.98); }
  .card .t { font-weight:700; font-size:17px; letter-spacing:-.01em; }
  .card .a { color:var(--muted); font-size:14px; margin-top:1px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:9px; }
  .chip { font-size:12px; font-weight:600; padding:3px 10px; border-radius:20px; background:var(--soft); color:var(--text); }
  .chip.me { background:var(--ink); color:var(--ink-t); }

  .st { flex:0 0 auto; width:24px; height:24px; border-radius:50%; border:2px solid var(--muted); position:relative; }
  .st.work { border-color:var(--ink); background:conic-gradient(var(--ink) 0 50%, transparent 0 100%); }
  .st.sched { border-color:var(--ink); background:var(--ink); }
  .st.sched::after { content:""; position:absolute; inset:6px; border-radius:50%; background:var(--ink-t); }
  .st.done { border-color:var(--ink); background:var(--ink); }
  .st.done::after { content:""; position:absolute; left:6px; top:2px; width:5px; height:10px; border:solid var(--ink-t); border-width:0 2px 2px 0; transform:rotate(45deg); }

  /* ---------- нижняя шторка ---------- */
  dialog { border:0; padding:0; margin:auto 0 0; width:100%; max-width:100%; max-height:92dvh; background:var(--sheet); color:var(--text);
    border-radius:28px 28px 0 0; overflow:hidden; }
  @media (min-width:700px) { dialog { margin:auto; width:560px; border-radius:28px; max-height:88vh; } }
  dialog[open] { animation:up .28s cubic-bezier(.2,.8,.2,1); }
  dialog::backdrop { background:rgba(0,0,0,.45); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); }
  @keyframes up { from { transform:translateY(40px); opacity:0; } to { transform:none; opacity:1; } }
  .grab { width:38px; height:5px; border-radius:3px; background:var(--line); margin:8px auto 0; }
  .dh { padding:12px 20px 10px; display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .dh .t { font-size:24px; font-weight:800; letter-spacing:-.02em; line-height:1.15; }
  .dh .s { color:var(--muted); font-size:14px; margin-top:2px; }
  .x { flex:0 0 auto; width:32px; height:32px; border-radius:50%; border:0; background:var(--soft); font-size:18px; line-height:1; cursor:pointer; color:var(--muted); }
  .db { padding:4px 20px calc(24px + env(safe-area-inset-bottom)); overflow-y:auto; max-height:calc(92dvh - 80px); -webkit-overflow-scrolling:touch; }

  .grp { background:var(--card); border-radius:18px; margin-top:8px; overflow:hidden; }
  .grp .r { padding:11px 16px; border-top:1px solid var(--line); }
  .grp .r:first-child { border-top:0; }
  .lbl { font-size:12px; color:var(--muted); font-weight:600; margin-bottom:1px; }
  .pre { white-space:pre-wrap; word-break:break-word; }
  a { color:var(--text); text-decoration:underline; text-underline-offset:3px; text-decoration-color:var(--muted); }

  .note { margin-top:14px; padding:13px 16px; background:var(--card); border-radius:16px; font-size:15px; }
  .note b { font-weight:700; }
  .big { font-size:22px; font-weight:800; letter-spacing:-.02em; margin-top:2px; }

  .btn { display:flex; align-items:center; justify-content:center; width:100%; min-height:52px; margin-top:12px; border:0; border-radius:16px;
    font-size:17px; font-weight:700; cursor:pointer; text-decoration:none; background:var(--card); color:var(--text); }
  .btn.primary { background:var(--ink); color:var(--ink-t); }
  .btn.ghost { background:var(--card); }
  .btn.plain { background:transparent; color:var(--muted); font-weight:600; min-height:44px; margin-top:4px; }
  .btn:active { opacity:.75; }
  .btn:disabled { opacity:.45; }

  .sec { margin-top:20px; font-size:13px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  textarea { width:100%; min-height:84px; margin-top:6px; padding:12px 14px; border:0; border-radius:14px; background:var(--card); color:var(--text);
    font-family:inherit; font-size:16px; line-height:1.4; resize:vertical; outline:none; -webkit-appearance:none; appearance:none; }
  textarea:focus { box-shadow:0 0 0 2px var(--ink); }

  /* ---------- календарь ---------- */
  .pk { margin-top:12px; background:var(--card); border-radius:20px; padding:14px 12px 4px; }
  .pk-sum { text-align:center; font-weight:800; font-size:18px; letter-spacing:-.01em; padding-bottom:8px; }
  .cal-h { display:flex; align-items:center; justify-content:space-between; padding:0 4px 6px; }
  .cal-h .m { font-weight:700; }
  .ic { width:36px; height:36px; border:0; border-radius:50%; background:transparent; font-size:22px; line-height:1; cursor:pointer; }
  .ic:disabled { opacity:.25; }
  .cal-w, .cal-g { display:grid; grid-template-columns:repeat(7,1fr); text-align:center; }
  .cal-w span { font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; padding:4px 0; }
  .cal-g button { aspect-ratio:1/1; max-height:44px; margin:2px auto; width:100%; max-width:44px; border:0; border-radius:50%; background:transparent; font-size:16px; cursor:pointer; }
  .cal-g button.today { box-shadow:inset 0 0 0 1.5px var(--muted); }
  .cal-g button.sel { background:var(--ink); color:var(--ink-t); font-weight:800; box-shadow:none; }
  .cal-g button:disabled { color:var(--muted); opacity:.35; cursor:default; }
  .cal-g i { display:block; }

  /* ---------- барабаны времени (как в часах iPhone) ---------- */
  .wheels { position:relative; display:flex; align-items:center; justify-content:center; gap:0; height:200px; margin:6px auto 10px; max-width:240px; }
  .band { position:absolute; left:0; right:0; top:80px; height:40px; background:var(--soft); border-radius:12px; pointer-events:none; }
  .wheel { position:relative; flex:1; height:200px; overflow-y:scroll; scroll-snap-type:y mandatory; -webkit-overflow-scrolling:touch;
    scrollbar-width:none; overscroll-behavior:contain;
    -webkit-mask-image:linear-gradient(transparent, #000 32%, #000 68%, transparent); mask-image:linear-gradient(transparent, #000 32%, #000 68%, transparent); }
  .wheel::-webkit-scrollbar { display:none; }
  .wheel .sp { display:block; height:80px; }
  .wheel .it { height:40px; line-height:40px; text-align:center; font-size:22px; color:var(--muted); scroll-snap-align:center; scroll-snap-stop:always; cursor:pointer; font-variant-numeric:tabular-nums; }
  .wheel .it.sel { color:var(--text); font-weight:800; font-size:25px; }
  .colon { position:relative; z-index:1; font-size:24px; font-weight:800; width:14px; text-align:center; }

  #toast { position:fixed; left:50%; top:calc(14px + env(safe-area-inset-top)); transform:translate(-50%,-20px); background:var(--ink); color:var(--ink-t);
    padding:11px 18px; border-radius:30px; font-size:14px; font-weight:600; opacity:0; pointer-events:none; transition:all .25s ease; max-width:90vw; z-index:99; text-align:center; }
  #toast.show { opacity:1; transform:translate(-50%,0); }
  .gate { max-width:420px; margin:90px auto; padding:0 24px; text-align:center; color:var(--muted); }
</style>
</head>
<body>
<header>
  <div><h1>Задачи БА</h1><div id="who">&nbsp;</div></div>
  <div id="sync"><i></i><span>загрузка…</span></div>
</header>
<div class="tools">
  <div class="seg" id="seg"><button data-f="all" class="on">Все</button><button data-f="mine">Мои</button></div>
  <div id="stats"></div>
</div>
<main id="list"><div class="empty">Загрузка…</div></main>
<dialog id="dlg"><div class="grab"></div><div id="dlgBody"></div></dialog>
<div id="toast"></div>

<script>
/* ===== НАСТРОЙКА ===== */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbya4k0DQmu5HXcXJMoFq_vqcx2gmw0ajSIqf6cf-WGBKE01D2aDbHZ4hfUuLEx4RCqKqw/exec',
  POLL_MS: 10000,   // как часто обновлять (мс)
  CITY: ''          // например 'Самара' — уточняет ссылку на карту
};
/* ==================== */

const ST = { WAIT:'ожидает', WORK:'в работе', SCHED:'назначена дата', DONE:'выполнена' };
const GROUPS = [
  { s: ST.WAIT,  title: 'Ожидают',        full: 'Ожидает взятия в работу', cls: 'wait' },
  { s: ST.WORK,  title: 'В работе',       full: 'Взята в работу',          cls: 'work' },
  { s: ST.SCHED, title: 'Назначена дата', full: 'Назначена дата',          cls: 'sched' },
  { s: ST.DONE,  title: 'Выполнены',      full: 'Выполнена',               cls: 'done' }
];

const KEY = new URLSearchParams(location.search).get('k') || '';
const $ = (id) => document.getElementById(id);
const state = { points: [], json: '', user: '', openId: null, sig: '', busy: false, loading: false,
                filter: 'all', justScheduled: null, showResults: false, pk: null,
                pending: 0, seq: 0, ts: 0, queue: [], fails: 0, flushing: false, flushAt: 0 };

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = (n) => String(n).padStart(2, '0');
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

function fmtDate(s) {
  if (!s) return '';
  const d = new Date(s);
  if (isNaN(d)) return s;
  return cap(d.toLocaleString('ru-RU', { weekday:'short', day:'numeric', month:'long' })) + ' · ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function linkify(text) {
  return esc(text).replace(/(\+?[78][\s\d()\-]{9,}\d)/g, (m) => `<a href="tel:${m.replace(/[^\d+]/g, '')}">${m}</a>`);
}
function mapUrl(p) {
  return 'https://yandex.ru/maps/?text=' + encodeURIComponent([CONFIG.CITY, p.address].filter(Boolean).join(', '));
}
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 3200);
}
function setSync(ok, msg) {
  const el = $('sync');
  el.classList.toggle('bad', !ok);
  el.querySelector('span').textContent = ok
    ? new Date().toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit', second:'2-digit' })
    : 'нет связи' + (msg ? ' · ' + msg : '');
}

/* ---------- календарь iPhone (.ics) ---------- */
function icsText(p) {
  const s = new Date(p.date), e = new Date(s.getTime() + 3600e3);
  const f = (d) => `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const t = (x) => String(x || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
  const fold = (line) => {
    const ch = Array.from(line), out = [];
    for (let i = 0; i < ch.length; i += 60) out.push((i ? ' ' : '') + ch.slice(i, i + 60).join(''));
    return out.join('\r\n');
  };
  return [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Tochki//RU', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
    'BEGIN:VEVENT',
    `UID:${p.id}-${f(s)}@tochki`, `DTSTAMP:${stamp}`, `DTSTART:${f(s)}`, `DTEND:${f(e)}`,
    `SUMMARY:${t('Встреча: ' + p.name)}`, `LOCATION:${t(p.address)}`,
    `DESCRIPTION:${t([p.contact, p.task].filter(Boolean).join('\n\n'))}`,
    'BEGIN:VALARM', 'TRIGGER:-PT60M', 'ACTION:DISPLAY', 'DESCRIPTION:Встреча через час', 'END:VALARM',
    'END:VEVENT', 'END:VCALENDAR'
  ].map(fold).join('\r\n');
}
function addToCalendar(p) {
  const ics = icsText(p);
  if (isIOS) {                                   // iPhone: откроется окно «Добавить в Календарь»
    const a = document.createElement('a');
    a.href = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics);
    a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
  } else {                                       // компьютер: скачается .ics
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar;charset=utf-8' }));
    a.download = 'vstrecha.ics';
    document.body.appendChild(a); a.click(); a.remove();
  }
}

/* ---------- сеть ---------- */
const POST_HDR = { 'Content-Type': 'text/plain;charset=utf-8' };   // без preflight
const OUT_KEY = 'outbox:' + KEY;

// fetch с таймаутом: на iPhone запрос может «зависнуть» при сворачивании Safari и заблокировать обновления навсегда
async function fetchJson(url, opts, ms) {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), ms);
  try { const r = await fetch(url, { ...opts, signal: c.signal }); return await r.json(); }
  finally { clearTimeout(t); }
}

/* Очередь отправки: действие сначала сохраняется на телефоне и уходит на сервер с повторами,
   поэтому его не потерять, даже если закрыть сайт или пропадёт связь. */
function persistQueue() {
  try { localStorage.setItem(OUT_KEY, JSON.stringify(state.queue)); } catch {}
  state.pending = state.queue.length;
  showBadge();
}
function showBadge() {
  if (!state.pending) return;
  const el = $('sync'); el.classList.remove('bad');
  el.querySelector('span').textContent = 'сохраняю…';
}

// Локальное (мгновенное) применение действия
function applyLocal(p, action, x) {
  const q = { ...p };
  if (action === 'take') { q.status = ST.WORK; q.owner = state.user; }
  else if (action === 'release') { q.status = ST.WAIT; q.owner = ''; q.date = ''; }
  else if (action === 'schedule') { q.status = ST.SCHED; q.date = x.date; }
  else if (action === 'complete') { q.status = ST.DONE; q.discussed = x.discussed; q.result = x.result; q.expectation = x.expectation; q.done = new Date().toISOString(); }
  return q;
}
function overlay(points) {      // серверные данные + ещё не отправленные действия
  return state.queue.reduce((pts, it) => pts.map(p => p.id === it.id ? applyLocal(p, it.action, it.extra || {}) : p), points);
}

function act(action, extra, id) {
  id = id || state.openId;
  state.seq++;
  state.queue.push({ oid: Date.now() + '-' + Math.random().toString(36).slice(2, 7), action, id, extra: extra || {}, tries: 0 });
  persistQueue();
  setPoints(state.points.map(p => p.id === id ? applyLocal(p, action, extra || {}) : p));
  refreshDialog(true);
  flush();
}

async function flush() {
  if (state.flushing && Date.now() - state.flushAt < 45000) return;
  if (!state.queue.length) return;
  state.flushing = true; state.flushAt = Date.now();
  let failed = false;
  try {
    while (state.queue.length) {
      const it = state.queue[0];
      let d;
      try {
        d = await fetchJson(CONFIG.API_URL, { method: 'POST', headers: POST_HDR,
          body: JSON.stringify({ k: KEY, action: it.action, id: it.id, ...it.extra }) }, 30000);
      } catch (e) {                                  // нет связи / обрыв: оставляем в очереди и повторяем
        setSync(false, 'не отправлено, повторю');
        setTimeout(flush, 4000);
        return;
      }
      if (d.error === 'auth') return gate('Ключ доступа не подошёл. Откройте сайт по своей персональной ссылке.');
      if (!d.ok && !d.points) {                      // сбой на стороне Google (не отказ по правилам) — повторяем
        it.tries = (it.tries || 0) + 1;
        if (it.tries < 5) { persistQueue(); setSync(false, 'повторю'); setTimeout(flush, 4000); return; }
      }
      state.queue = state.queue.filter(x => x.oid !== it.oid);
      persistQueue();
      state.seq++;
      if (d.points) acceptServer(d);
      if (d.ok) { if (it.action === 'complete') { try { localStorage.removeItem(draftKey(it.id)); } catch {} } }
      else { failed = true; toast(d.error || 'Не удалось сохранить'); if (state.justScheduled === it.id) state.justScheduled = null; }
    }
  } finally { state.flushing = false; }
  state.pending = 0;
  setSync(true);
  const waiting = $('dlgBody').querySelector('[data-act=ics][disabled]');
  refreshDialog(failed || !!waiting);
}

async function load() {
  if (state.loading || state.pending) return;
  state.loading = true;
  const seq = state.seq;
  try {
    const d = await fetchJson(`${CONFIG.API_URL}?action=list&k=${encodeURIComponent(KEY)}&t=${Date.now()}`, {}, 15000);
    if (!d.ok) throw new Error(d.error);
    state.fails = 0;
    if (state.seq === seq && !state.pending) applyData(d);   // ответ устарел, если за это время было действие
    setSync(true);
  } catch (e) {
    if (String(e.message) === 'auth') return gate('Ключ доступа не подошёл. Откройте сайт по своей персональной ссылке.');
    if (++state.fails >= 2) setSync(false);                  // одиночный сбой не показываем
  } finally { state.loading = false; }
}

function setPoints(points) {
  const j = JSON.stringify(points);
  if (j !== state.json) { state.json = j; state.points = points; render(); }
}

function acceptServer(d) {
  if (d.ts && d.ts < state.ts) return;          // более старый ответ — игнорируем
  state.ts = d.ts || state.ts;
  try { localStorage.setItem('cache:' + KEY, JSON.stringify({ user: state.user, points: d.points })); } catch {}
  setPoints(state.queue.length ? overlay(d.points) : d.points);
}

function applyData(d) {
  state.user = d.user || state.user;
  $('who').textContent = state.user;
  acceptServer(d);
  refreshDialog(false);
}

/* ---------- список ---------- */
function render() {
  const only = state.filter === 'mine';
  const pts = state.points.filter(p => !only || p.owner === state.user);
  $('list').innerHTML = GROUPS.map(g => {
    const items = pts.filter(p => p.status === g.s);
    if (g.s === ST.SCHED) items.sort((a, b) => a.date.localeCompare(b.date));
    if (g.s === ST.DONE) items.sort((a, b) => b.done.localeCompare(a.done));
    const cards = items.map(p => `
      <article class="card" data-id="${esc(p.id)}">
        <div>
          <div class="t">${esc(p.name)}</div>
          <div class="a">${esc(p.address)}</div>
          ${(p.owner || (p.date && g.s === ST.SCHED)) ? `<div class="chips">
            ${p.owner ? `<span class="chip ${p.owner === state.user ? 'me' : ''}">${esc(p.owner)}</span>` : ''}
            ${p.date && g.s === ST.SCHED ? `<span class="chip">${esc(fmtDate(p.date))}</span>` : ''}
          </div>` : ''}
        </div>
        <span class="st ${g.cls}"></span>
      </article>`).join('');
    return `<h2>${g.title} <span class="n">${items.length}</span></h2>` + (cards || '<div class="empty">Пусто</div>');
  }).join('');
  const done = state.points.filter(p => p.status === ST.DONE).length;
  $('stats').textContent = `${done} из ${state.points.length} выполнено`;
}

/* ---------- шторка ---------- */
const sigOf = (p) => p ? [p.status, p.owner, p.date].join('|') : '';

function openDialog(id) {
  state.openId = id; state.justScheduled = null; state.showResults = false; state.pk = null;
  renderDialog();
  if (!$('dlg').open) $('dlg').showModal();
  $('dlgBody').scrollTop = 0;
}
function closeDialog() { if ($('dlg').open) $('dlg').close(); }

function refreshDialog(force) {
  if (!$('dlg').open) return;
  const p = state.points.find(x => x.id === state.openId);
  if (!p) { closeDialog(); toast('Точка удалена админом'); return; }
  if (force || sigOf(p) !== state.sig) {
    const changed = !force && state.sig;
    renderDialog();
    if (changed) toast('Точка изменилась — данные обновлены');
  }
}

const draftKey = (id) => 'draft:' + id;
function readDraft(id) { try { return JSON.parse(localStorage.getItem(draftKey(id)) || '{}'); } catch { return {}; } }
function saveDraft() {
  const o = { discussed: $('f1')?.value || '', result: $('f2')?.value || '', expectation: $('f3')?.value || '' };
  try { localStorage.setItem(draftKey(state.openId), JSON.stringify(o)); } catch {}
}

function renderDialog() {
  const p = state.points.find(x => x.id === state.openId);
  if (!p) return;
  state.sig = sigOf(p);
  state.pk = null;
  const mine = p.owner === state.user;
  const g = GROUPS.find(x => x.s === p.status);
  let body = '';

  const info = `
    <div class="grp">
      <div class="r"><div class="lbl">Адрес</div><a href="${mapUrl(p)}" target="_blank" rel="noopener">${esc(p.address) || '—'}</a></div>
      <div class="r"><div class="lbl">Контакт</div><div class="pre">${linkify(p.contact) || '—'}</div></div>
      <div class="r"><div class="lbl">Задача</div><div class="pre">${esc(p.task) || '—'}</div></div>
    </div>`;

  if (p.status === ST.WAIT) {
    body = info + `<button class="btn primary" data-act="take">Беру в работу</button>`;

  } else if (p.status === ST.WORK) {
    body = info + (mine
      ? `<div class="note">Точка у вас. Созвонитесь с контактом, затем назначьте встречу.</div>
         <button class="btn primary" data-act="pick">Назначить дату и время</button>
         <div id="pk"></div>
         <button class="btn plain" data-act="release">Вернуть в очередь</button>`
      : `<div class="note">В работе у <b>${esc(p.owner)}</b></div>`);

  } else if (p.status === ST.SCHED) {
    if (mine && state.justScheduled === p.id) {
      // сразу после назначения — только подтверждение и календарь, без следующих шагов
      body = `<div class="note">Встреча назначена<div class="big">${esc(fmtDate(p.date))}</div></div>
        <button class="btn primary" data-act="ics" ${state.pending ? 'disabled' : ''}>${state.pending ? 'Сохраняю встречу…' : 'Добавить в календарь iPhone'}</button>
        <button class="btn plain" data-act="close">Готово</button>`;
    } else {
      const d = readDraft(p.id);
      body = `<div class="note">Встреча<div class="big">${esc(fmtDate(p.date))}</div>
          <div style="color:var(--muted);font-size:14px;margin-top:2px">Исполнитель: ${esc(p.owner)}</div></div>
        <button class="btn ghost" data-act="ics" ${state.pending ? 'disabled' : ''}>${state.pending ? 'Сохраняю…' : 'Добавить в календарь iPhone'}</button>` + info;
      if (mine) {
        body += `<button class="btn ghost" data-act="pick">Перенести встречу</button><div id="pk"></div>`;
        if (state.showResults) {
          body += `<div class="sec">Итоги встречи</div>
            <div class="lbl" style="margin-top:12px">1. Что обсудили</div>
            <textarea id="f1" data-draft>${esc(d.discussed || '')}</textarea>
            <div class="lbl" style="margin-top:12px">2. Какой итог встречи</div>
            <textarea id="f2" data-draft>${esc(d.result || '')}</textarea>
            <div class="lbl" style="margin-top:12px">3. Какой результат может ожидать отдел продаж</div>
            <textarea id="f3" data-draft>${esc(d.expectation || '')}</textarea>
            <button class="btn primary" data-act="complete">Сохранить итоги</button>`;
        } else {
          body += `<button class="btn primary" data-act="results">Внести итоги встречи</button>`;
        }
        body += `<button class="btn plain" data-act="release">Вернуть в очередь</button>`;
      }
    }

  } else if (p.status === ST.DONE) {
    body = `<div class="note">Выполнено · <b>${esc(p.owner)}</b>${p.date ? '<div style="color:var(--muted);font-size:14px;margin-top:2px">Встреча: ' + esc(fmtDate(p.date)) + '</div>' : ''}</div>
      <div class="grp">
        <div class="r"><div class="lbl">1. Что обсудили</div><div class="pre">${esc(p.discussed) || '—'}</div></div>
        <div class="r"><div class="lbl">2. Итог встречи</div><div class="pre">${esc(p.result) || '—'}</div></div>
        <div class="r"><div class="lbl">3. Ожидание для отдела продаж</div><div class="pre">${esc(p.expectation) || '—'}</div></div>
      </div>` + info;
  }

  $('dlgBody').innerHTML = `
    <div class="dh"><div><div class="t">${esc(p.name)}</div><div class="s">${g.full}</div></div>
      <button class="x" data-act="close" aria-label="Закрыть">✕</button></div>
    <div class="db">${body}</div>`;
}

/* ---------- выбор даты и времени ---------- */
function mountPicker(p) {
  const base = p.date && !isNaN(new Date(p.date)) ? new Date(p.date) : (() => {
    const d = new Date(); d.setDate(d.getDate() + 1); d.setHours(12, 0, 0, 0); return d;
  })();
  state.pk = { y: base.getFullYear(), m: base.getMonth(), d: base.getDate(), h: base.getHours(), mi: base.getMinutes(),
               vy: base.getFullYear(), vm: base.getMonth() };
  $('pk').innerHTML = `
    <div class="pk">
      <div class="pk-sum" id="pkSum"></div>
      <div class="cal-h">
        <button class="ic" data-pk="prev" aria-label="Предыдущий месяц">‹</button>
        <div class="m" id="calT"></div>
        <button class="ic" data-pk="next" aria-label="Следующий месяц">›</button>
      </div>
      <div class="cal-w"><span>пн</span><span>вт</span><span>ср</span><span>чт</span><span>пт</span><span>сб</span><span>вс</span></div>
      <div class="cal-g" id="calG"></div>
      <div class="wheels">
        <div class="band"></div>
        <div class="wheel" id="wh"></div><div class="colon">:</div><div class="wheel" id="wm"></div>
      </div>
    </div>
    <button class="btn primary" data-act="schedule">${p.status === ST.SCHED ? 'Сохранить новое время' : 'Назначить встречу'}</button>`;
  renderCal();
  buildWheel('wh', 24, state.pk.h);
  buildWheel('wm', 60, state.pk.mi);
  updateSum();
  $('pk').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function renderCal() {
  const k = state.pk;
  const first = new Date(k.vy, k.vm, 1);
  const lead = (first.getDay() + 6) % 7;                // неделя с понедельника
  const days = new Date(k.vy, k.vm + 1, 0).getDate();
  const today = new Date(); today.setHours(0, 0, 0, 0);
  $('calT').textContent = cap(first.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' }));
  const isCurMonth = k.vy === today.getFullYear() && k.vm === today.getMonth();
  document.querySelector('[data-pk="prev"]').disabled = isCurMonth;
  let h = '<i></i>'.repeat(lead);
  for (let d = 1; d <= days; d++) {
    const dt = new Date(k.vy, k.vm, d);
    const past = dt < today;
    const sel = k.y === k.vy && k.m === k.vm && k.d === d;
    const isToday = dt.getTime() === today.getTime();
    h += `<button data-day="${d}" class="${sel ? 'sel' : ''} ${isToday ? 'today' : ''}" ${past ? 'disabled' : ''}>${d}</button>`;
  }
  $('calG').innerHTML = h;
}

function buildWheel(id, n, val) {
  const el = $(id);
  el.innerHTML = '<i class="sp"></i>' +
    Array.from({ length: n }, (_, i) => `<div class="it" data-i="${i}">${pad(i)}</div>`).join('') + '<i class="sp"></i>';
  const mark = (i) => {
    if (el._sel) el._sel.classList.remove('sel');
    el._sel = el.children[i + 1]; el._sel.classList.add('sel');
  };
  el.scrollTop = val * 40;
  mark(val);
  let raf;
  el.addEventListener('scroll', () => {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      const i = Math.max(0, Math.min(n - 1, Math.round(el.scrollTop / 40)));
      mark(i);
      if (id === 'wh') state.pk.h = i; else state.pk.mi = i;
      updateSum();
    });
  });
  el.addEventListener('click', (e) => {
    const it = e.target.closest('.it');
    if (it) el.scrollTo({ top: it.dataset.i * 40, behavior: 'smooth' });
  });
}

function updateSum() {
  const k = state.pk; if (!k) return;
  const d = new Date(k.y, k.m, k.d, k.h, k.mi);
  $('pkSum').textContent = cap(d.toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'long' })) + ' · ' + pad(k.h) + ':' + pad(k.mi);
}

/* ---------- события ---------- */
$('list').addEventListener('click', (e) => { const c = e.target.closest('.card'); if (c) openDialog(c.dataset.id); });
$('seg').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  state.filter = b.dataset.f;
  document.querySelectorAll('#seg button').forEach(x => x.classList.toggle('on', x === b));
  render();
});
$('dlg').addEventListener('click', (e) => { if (e.target === $('dlg')) closeDialog(); });
$('dlg').addEventListener('close', () => { state.openId = null; state.sig = ''; state.justScheduled = null; state.showResults = false; state.pk = null; });
$('dlgBody').addEventListener('input', (e) => { if (e.target.matches('[data-draft]')) saveDraft(); });

$('dlgBody').addEventListener('click', async (e) => {
  // навигация по календарю и выбор дня
  const pkb = e.target.closest('[data-pk]');
  if (pkb && state.pk) {
    const k = state.pk, m = k.vm + (pkb.dataset.pk === 'next' ? 1 : -1);
    const dt = new Date(k.vy, m, 1); k.vy = dt.getFullYear(); k.vm = dt.getMonth();
    return renderCal();
  }
  const day = e.target.closest('[data-day]');
  if (day && state.pk) {
    const k = state.pk; k.y = k.vy; k.m = k.vm; k.d = +day.dataset.day;
    renderCal(); return updateSum();
  }

  const btn = e.target.closest('[data-act]'); if (!btn) return;
  const a = btn.dataset.act;
  const p = state.points.find(x => x.id === state.openId);

  if (a === 'close') return closeDialog();

  if (a === 'take') {
    const id = state.openId;
    closeDialog(); toast('Точка взята в работу');           // следующий шаг — позже
    act('take', {}, id);
  }
  else if (a === 'pick') { btn.style.display = 'none'; mountPicker(p); }
  else if (a === 'schedule') {
    const k = state.pk; if (!k) return;
    const when = new Date(k.y, k.m, k.d, k.h, k.mi);
    if (when.getTime() < Date.now() - 60000) return toast('Это время уже прошло');
    const iso = `${k.y}-${pad(k.m + 1)}-${pad(k.d)}T${pad(k.h)}:${pad(k.mi)}`;
    state.justScheduled = state.openId;
    act('schedule', { date: iso });                          // экран подтверждения появляется сразу
  }
  else if (a === 'ics') { if (p && p.date) addToCalendar(p); }
  else if (a === 'results') { state.showResults = true; renderDialog(); }
  else if (a === 'release') {
    if (confirm('Вернуть точку в очередь? Дата встречи сбросится.')) {
      const id = state.openId;
      closeDialog(); toast('Точка возвращена в очередь');
      act('release', {}, id);
    }
  }
  else if (a === 'complete') {
    const body = { discussed: $('f1').value, result: $('f2').value, expectation: $('f3').value };
    if (!body.discussed.trim() || !body.result.trim() || !body.expectation.trim()) return toast('Заполните все три пункта');
    const id = state.openId;
    closeDialog(); toast('Итоги сохранены');
    act('complete', body, id);                              // черновик удалится после подтверждения сервером
  }
});

function gate(msg) {
  document.querySelector('.tools').remove();
  $('list').innerHTML = `<div class="gate">${esc(msg)}</div>`;
  clearInterval(state.timer);
  $('sync').style.display = 'none';
}

/* ---------- старт ---------- */
if (!KEY) gate('Откройте сайт по своей персональной ссылке (с ключом после «?k=»).');
else {
  try { state.queue = JSON.parse(localStorage.getItem(OUT_KEY) || '[]'); } catch { state.queue = []; }
  state.pending = state.queue.length;
  try {                                          // прошлые данные + неотправленные действия — сразу, пока грузятся свежие
    const c = JSON.parse(localStorage.getItem('cache:' + KEY) || 'null');
    if (c && c.points) { state.user = c.user || ''; $('who').textContent = state.user; setPoints(overlay(c.points)); }
  } catch {}
  showBadge();
  flush();
  load();
  state.timer = setInterval(() => { if (!document.hidden) { flush(); load(); } }, CONFIG.POLL_MS);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { state.loading = false; flush(); load(); } });
  window.addEventListener('online', () => { flush(); load(); });
}
</script>
</body>
</html>
